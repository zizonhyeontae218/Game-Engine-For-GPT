name: GE4G Flutter clients
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libgtk-3-dev xvfb xauth python3-pil
      - run: cargo build --locked -p ge4g-cli
      - run: python3 scripts/pack_game.py examples/basement_demo --game-id demo.basement --out dist/basement-demo.ge4g
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: client
      - run: flutter build linux --release
        working-directory: client
      - run: python3 scripts/bundle_desktop.py --client client/build/linux/x64/release/bundle --game dist/basement-demo.ge4g --platform linux --out dist/ge4g-basement-linux
      - run: xvfb-run -a python3 scripts/client_smoke.py dist/ge4g-basement-linux
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-basement-linux-embedded
          path: |
            dist/ge4g-basement-linux.tar.gz
            dist/basement-demo.ge4g
            artifacts/client-smoke/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: cargo build --locked -p ge4g-cli
      - run: python scripts/pack_game.py examples/basement_demo --game-id demo.basement --validator target/debug/ge4g.exe --out dist/basement-demo.ge4g
      - run: flutter pub get
        working-directory: client
      - run: flutter build windows --release
        working-directory: client
      - run: python scripts/bundle_desktop.py --client client/build/windows/x64/runner/Release --game dist/basement-demo.ge4g --platform windows --out dist/ge4g-basement-windows
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-basement-windows-embedded
          path: dist/ge4g-basement-windows.zip
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client
      - run: flutter build apk --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-android-client
          path: client/build/app/outputs/flutter-apk/app-release.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client
      - run: flutter build ios --release --no-codesign
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-ios-unsigned
          path: client/build/ios/iphoneos/Runner.app
