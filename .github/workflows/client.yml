name: GE4G Flutter clients
on:
  push:
    paths: ['client/**', 'crates/**', 'Cargo.*', 'packaging/**', 'scripts/pack_game.py', 'scripts/bundle_desktop.py', 'scripts/client_icons.py', 'scripts/client_smoke.py', '.github/workflows/client.yml', '.gitattributes', 'examples/**']
  pull_request:
    paths: ['client/**', 'crates/**', 'Cargo.*', 'packaging/**', 'scripts/pack_game.py', 'scripts/bundle_desktop.py', 'scripts/client_icons.py', 'scripts/client_smoke.py', '.github/workflows/client.yml', '.gitattributes', 'examples/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ge4g-clients-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libasound2-dev libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good xvfb xauth python3-pil
      - run: cargo build --locked -p ge4g-cli
      - run: python3 scripts/pack_game.py examples/basement_demo --game-id demo.basement --out dist/basement-demo.ge4g
      - run: python3 scripts/pack_game.py examples/flatland_pacman --game-id demo.flatland.pacman --version 0.2.0-rc.3 --out dist/flatland-pacman.ge4g
      - run: python3 scripts/pack_game.py examples/flatland_signal_yard --game-id demo.flatland.signal-yard --version 0.2.0-rc.3 --out dist/flatland-signal-yard.ge4g
      - run: python3 scripts/pack_game.py examples/flatland_nuvema --game-id demo.flatland.nuvema --version 0.2.0-rc.3 --out dist/flatland-nuvema.ge4g
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: client
      - run: flutter build linux --release
        working-directory: client
      - run: python3 scripts/bundle_desktop.py --client client/build/linux/x64/release/bundle --game dist/basement-demo.ge4g --platform linux --out dist/ge4g-basement-linux
      - run: xvfb-run -a python3 scripts/client_smoke.py dist/ge4g-basement-linux
      - run: python3 scripts/bundle_desktop.py --client client/build/linux/x64/release/bundle --game dist/flatland-pacman.ge4g --platform linux --out dist/ge4g-flatland-linux
      - run: xvfb-run -a python3 scripts/client_smoke.py dist/ge4g-flatland-linux --project examples/flatland_pacman
      - run: python3 scripts/bundle_desktop.py --client client/build/linux/x64/release/bundle --game dist/flatland-signal-yard.ge4g --platform linux --out dist/ge4g-signal-yard-linux
      - run: xvfb-run -a python3 scripts/client_smoke.py dist/ge4g-signal-yard-linux --project examples/flatland_signal_yard
      - run: python3 scripts/bundle_desktop.py --client client/build/linux/x64/release/bundle --game dist/flatland-nuvema.ge4g --platform linux --out dist/ge4g-nuvema-linux
      - run: xvfb-run -a python3 scripts/client_smoke.py dist/ge4g-nuvema-linux --project examples/flatland_nuvema
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-nuvema-linux-embedded
          path: |
            dist/ge4g-nuvema-linux.tar.gz
            dist/flatland-nuvema.ge4g
            artifacts/nuvema-smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-basement-linux-embedded
          path: |
            dist/ge4g-basement-linux.tar.gz
            dist/basement-demo.ge4g
            dist/flatland-pacman.ge4g
            dist/ge4g-flatland-linux.tar.gz
            dist/flatland-signal-yard.ge4g
            dist/ge4g-signal-yard-linux.tar.gz
            artifacts/signal-yard-smoke/
            artifacts/client-smoke/
            artifacts/flatland-smoke/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: cargo build --locked -p ge4g-cli
      - run: python scripts/pack_game.py examples/basement_demo --game-id demo.basement --validator target/debug/ge4g.exe --out dist/basement-demo.ge4g
      - run: python scripts/pack_game.py examples/flatland_pacman --game-id demo.flatland.pacman --version 0.2.0-rc.3 --validator target/debug/ge4g.exe --out dist/flatland-pacman.ge4g
      - run: python scripts/pack_game.py examples/flatland_signal_yard --game-id demo.flatland.signal-yard --version 0.2.0-rc.3 --validator target/debug/ge4g.exe --out dist/flatland-signal-yard.ge4g
      - run: python scripts/pack_game.py examples/flatland_nuvema --game-id demo.flatland.nuvema --version 0.2.0-rc.3 --validator target/debug/ge4g.exe --out dist/flatland-nuvema.ge4g
      - run: flutter pub get
        working-directory: client
      - run: flutter build windows --release
        working-directory: client
      - run: python scripts/bundle_desktop.py --client client/build/windows/x64/runner/Release --game dist/basement-demo.ge4g --platform windows --out dist/ge4g-basement-windows
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-basement-windows-embedded
          path: dist/ge4g-basement-windows.zip
      - run: python scripts/bundle_desktop.py --client client/build/windows/x64/runner/Release --game dist/flatland-pacman.ge4g --platform windows --out dist/ge4g-flatland-windows
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-flatland-windows-embedded
          path: dist/ge4g-flatland-windows.zip
      - run: python scripts/bundle_desktop.py --client client/build/windows/x64/runner/Release --game dist/flatland-signal-yard.ge4g --platform windows --out dist/ge4g-signal-yard-windows
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-signal-yard-windows-embedded
          path: dist/ge4g-signal-yard-windows.zip
      - run: python scripts/bundle_desktop.py --client client/build/windows/x64/runner/Release --game dist/flatland-nuvema.ge4g --platform windows --out dist/ge4g-nuvema-windows
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-nuvema-windows-embedded
          path: dist/ge4g-nuvema-windows.zip
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client
      - run: flutter build apk --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-android-unsigned
          path: client/build/app/outputs/flutter-apk/app-release.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client
      - run: flutter build ios --release --no-codesign
        working-directory: client
      - run: mkdir -p dist && ditto -c -k --keepParent client/build/ios/iphoneos/Runner.app dist/GE4G-iOS-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-ios-unsigned
          path: dist/GE4G-iOS-unsigned.zip
