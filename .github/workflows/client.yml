name: GE4G Flutter clients
on:
  push:
    paths: ['client/**', 'crates/**', 'Cargo.*', 'packaging/**', 'scripts/pack_game.py', 'scripts/bundle_desktop.py', 'scripts/client_icons.py', 'scripts/client_smoke.py', 'scripts/windows_utf8_regression.py', 'scripts/generate_harbor_demo.py', '.github/workflows/client.yml', '.gitattributes', 'examples/**']
  pull_request:
    paths: ['client/**', 'crates/**', 'Cargo.*', 'packaging/**', 'scripts/pack_game.py', 'scripts/bundle_desktop.py', 'scripts/client_icons.py', 'scripts/client_smoke.py', 'scripts/windows_utf8_regression.py', 'scripts/generate_harbor_demo.py', '.github/workflows/client.yml', '.gitattributes', 'examples/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ge4g-clients-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: python -m pip install Pillow
      - run: cargo build --locked -p ge4g-cli
      - run: python scripts/pack_game.py examples/basement_demo --game-id demo.basement --validator target/debug/ge4g.exe --out dist/basement-demo.ge4g
      - run: python scripts/pack_game.py examples/flatland_pacman --game-id demo.flatland.pacman --version 0.2.0 --validator target/debug/ge4g.exe --out dist/flatland-pacman.ge4g
      - run: python scripts/pack_game.py examples/flatland_signal_yard --game-id demo.flatland.signal-yard --version 0.2.0 --validator target/debug/ge4g.exe --out dist/flatland-signal-yard.ge4g
      - run: python scripts/pack_game.py examples/flatland_harbor --game-id demo.flatland.harbor --version 0.2.0 --validator target/debug/ge4g.exe --out dist/flatland-harbor.ge4g
      - run: python scripts/windows_utf8_regression.py --prepare
      - run: flutter pub get
        working-directory: client
      - run: flutter analyze
        working-directory: client
      - run: flutter test
        working-directory: client
        env:
          GE4G_LAYOUT_CAPTURE: ${{ runner.temp }}/pre1p6-layout
      - run: flutter build windows --release
        working-directory: client
      - name: Start actual Pentomino Windows runtime and capture
        shell: pwsh
        run: |
          $env:GE4G_SMOKE_OUTPUT = "$env:RUNNER_TEMP/pre1p6-native"
          New-Item -ItemType Directory -Force $env:GE4G_SMOKE_OUTPUT | Out-Null
          $exe = (Resolve-Path 'client/build/windows/x64/runner/Release/ge4g_client.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--pentomino','--pentomino-capture' -PassThru
          try {
            $marker = Join-Path $env:GE4G_SMOKE_OUTPUT 'pentomino-start-state.json'
            $deadline = (Get-Date).AddSeconds(90)
            while (!(Test-Path $marker) -and (Get-Date) -lt $deadline -and !$process.HasExited) { Start-Sleep -Seconds 1 }
            if (!(Test-Path $marker)) { throw 'Actual P5 native startup/capture did not complete' }
            $state = Get-Content $marker -Raw | ConvertFrom-Json
            if ($state.battle.fighters.Count -ne 2 -or $state.battle.turn -ne 0) { throw 'Unexpected authoritative startup state' }
            if (!(Test-Path (Join-Path $env:GE4G_SMOKE_OUTPUT 'pentomino-start-ui.png'))) { throw 'No actual UI capture' }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ge4g-pre1p6-rendered-evidence
          path: |
            ${{ runner.temp }}/pre1p6-native
            ${{ runner.temp }}/pre1p6-layout
      - run: python scripts/package_pre1p6.py --client client/build/windows/x64/runner/Release --out dist/ge4g-pre1p6-windows
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-pre1p6-windows
          path: |
            dist/ge4g-pre1p6-windows.zip
            dist/ge4g-pre1p6-windows.zip.sha256
      - run: python scripts/bundle_desktop.py --client client/build/windows/x64/runner/Release --game dist/basement-demo.ge4g --platform windows --out dist/ge4g-basement-windows
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-basement-windows-embedded
          path: dist/ge4g-basement-windows.zip
      - run: python scripts/bundle_desktop.py --client client/build/windows/x64/runner/Release --game dist/flatland-pacman.ge4g --platform windows --out dist/ge4g-flatland-windows
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-flatland-windows-embedded
          path: dist/ge4g-flatland-windows.zip
      - run: python scripts/bundle_desktop.py --client client/build/windows/x64/runner/Release --game dist/flatland-signal-yard.ge4g --platform windows --out dist/ge4g-signal-yard-windows
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-signal-yard-windows-embedded
          path: dist/ge4g-signal-yard-windows.zip
      - run: python scripts/bundle_desktop.py --client client/build/windows/x64/runner/Release --game dist/flatland-harbor.ge4g --platform windows --out dist/ge4g-harbor-windows
      - run: python scripts/windows_utf8_regression.py --launch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ge4g-final-rendered-evidence
          path: artifacts/final-windows/
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-harbor-windows-embedded
          path: dist/ge4g-harbor-windows.zip
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client
      - run: flutter build apk --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: ge4g-android-unsigned
          path: client/build/app/outputs/flutter-apk/app-release.apk
