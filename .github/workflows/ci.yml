name: Basement acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: python3 scripts/release_consistency.py --self-test
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: python3 scripts/check_p2_boundaries.py
      - run: python3 scripts/check_p3_boundaries.py
      - run: python3 scripts/check_p4_boundaries.py
      - run: cargo run --locked -p ge4g-pentomino-native --example p4_public -- samples/pentomino_p4/game.json $RUNNER_TEMP/p4-frames
      - run: cargo build --locked -p ge4g-pentomino-native
      - run: python3 samples/pentomino_p4/consumer.py target/debug/libge4g_pentomino_native.so --out $RUNNER_TEMP/p4-consumer
      - run: cc -std=c11 -Wall -Wextra -Werror samples/pentomino_p4/smoke.c -Icrates/ge4g-pentomino-native/include -Ltarget/debug -lge4g_pentomino_native -Wl,-rpath,$PWD/target/debug -o $RUNNER_TEMP/p4-c-smoke && $RUNNER_TEMP/p4-c-smoke
      - run: python3 samples/pentomino_p5/consumer.py target/debug/libge4g_pentomino_native.so --out $RUNNER_TEMP/p5-consumer
      - run: cc -std=c11 -Wall -Wextra -Werror samples/pentomino_p5/smoke.c -Icrates/ge4g-pentomino-native/include -Ltarget/debug -lge4g_pentomino_native -Wl,-rpath,$PWD/target/debug -o $RUNNER_TEMP/p5-c-smoke && $RUNNER_TEMP/p5-c-smoke
      - run: python3 scripts/package_p5_native.py --library target/debug/libge4g_pentomino_native.so --out $RUNNER_TEMP/p5-public-sdk
      - run: cd $RUNNER_TEMP/p5-public-sdk && python3 consumer.py ./libge4g_pentomino_native.so --out $RUNNER_TEMP/p5-packaged-consumer
      - uses: actions/upload-artifact@v4
        with:
          name: p5-native-public-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p5-public-sdk.zip
            ${{ runner.temp }}/p5-packaged-consumer/result.json
      - run: cargo run --locked -p ge4g-pentomino-view --example p3_public
      - run: cargo run --locked -p ge4g-pentomino-view-legacy --example fifth_demo -- examples/flatland_nuvema $RUNNER_TEMP/p3-fifth-frames
      - run: cargo run --locked -p ge4g-cli -- validate examples/basement_demo --json
      - run: cargo run --locked -p ge4g-cli -- test examples/basement_demo --json
      - run: cargo run --locked -p ge4g-cli -- validate examples/flatland_pacman --json
      - run: cargo run --locked -p ge4g-cli -- test examples/flatland_pacman --json
      - run: cargo run --locked -p ge4g-cli -- test examples/flatland_signal_yard --json
      - run: cargo run --locked -p ge4g-cli -- test examples/flatland_harbor --json
      - run: cargo run --locked -p ge4g-cli -- test examples/flatland_nuvema --json
      - run: python3 scripts/filetree.py lint
      - run: cargo clippy --locked -p ge4g-cli --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked -p ge4g-cli --no-default-features
      - run: python3 scripts/package_p4_native.py --out $RUNNER_TEMP/p4-public-sdk
      - run: cd $RUNNER_TEMP/p4-public-sdk && python3 consumer.py ./libge4g_pentomino_native.so --out $RUNNER_TEMP/p4-packaged-consumer
      - uses: actions/upload-artifact@v4
        with:
          name: p4-native-public-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p4-public-sdk.zip
            ${{ runner.temp }}/p4-public-sdk.zip.sha256
            ${{ runner.temp }}/p4-packaged-consumer/result.json
