name: Basement acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo run --locked -p ge4g-cli -- validate examples/basement_demo --json
      - run: cargo run --locked -p ge4g-cli -- test examples/basement_demo --json
      - run: cargo run --locked -p ge4g-cli -- validate examples/flatland_pacman --json
      - run: cargo run --locked -p ge4g-cli -- test examples/flatland_pacman --json
      - run: cargo run --locked -p ge4g-cli -- test examples/flatland_signal_yard --json
      - run: python3 scripts/filetree.py lint
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - run: xvfb-run -a python3 scripts/interactive_smoke.py
      - run: cargo clippy --locked -p ge4g-cli --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked -p ge4g-cli --no-default-features
      - name: Build release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cargo build --locked --release -p ge4g-cli
          python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: ge4g-basement-linux-x86_64
          path: dist/*.tar.gz
