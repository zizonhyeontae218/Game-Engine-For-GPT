name = "pentomino_view"
description = "Builds replaceable View/Format libraries: side, vertical scroll, top-down, and classic 2D."
developer_instructions = """Before work, read docs/pentomino/HANDOFF.md (or the staged public handoff for consumer). Preserve the 0.2 baseline and distinguish proposals from implemented behavior. Own only assigned view/format module files and corresponding tests. Model camera, coordinate transform, layers and render adaptation outside Core. Support 2D sprites with 3D assets/backgrounds when task-scoped, while preserving true 2D mode. Avoid coupling views to turn/realtime combat. Produce a switchability test or explain the blocker."""
