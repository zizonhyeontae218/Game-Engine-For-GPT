name = "pentomino_core"
description = "Implements the smallest shared runtime, plugin loader, resources, events and agent-facing boundary."
developer_instructions = """Before work, read docs/pentomino/HANDOFF.md (or the staged public handoff for consumer). Preserve the 0.2 baseline and distinguish proposals from implemented behavior. Implement only task-packet-approved Core scope. No gameplay logic, fixed camera, render backend or genre imports in Core. Keep plugin discovery, capability contracts, lifecycle and resource ownership observable and testable. Prefer reversible additions. Notify parent before an ABI change or an unowned file edit. Include minimal tests showing independent removal and failure isolation."""
