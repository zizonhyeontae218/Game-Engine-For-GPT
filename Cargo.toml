[workspace]
members = ["crates/ge4g-core", "crates/ge4g-project", "crates/ge4g-runtime", "crates/ge4g-render2d", "crates/ge4g-platform", "crates/ge4g-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
