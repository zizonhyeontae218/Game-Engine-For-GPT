[package]
name = "ge4g-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["window"]
window = ["dep:minifb"]

[dependencies]
ge4g-core = { path = "../ge4g-core" }
ge4g-project = { path = "../ge4g-project" }
ge4g-runtime = { path = "../ge4g-runtime" }
ge4g-render2d = { path = "../ge4g-render2d" }
minifb = { version = "0.28", default-features = false, features = ["x11"], optional = true }
